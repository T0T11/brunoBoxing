/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'application'
    id 'java'
}


repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation("com.github.freva:ascii-table:1.9.0")
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.14.3")
    testImplementation("org.junit.jupiter:junit-jupiter-engine:5.14.3")
    testImplementation("org.junit.platform:junit-platform-launcher:1.10.0")
}

application {
    mainClass = 'edu.teamrocket.brunosbox.BrunosBox'
}

jar {
    manifest {
        attributes 'Main-Class' : 'edu.teamrocket.brunosbox.BrunosBox',
                'Package-Title' : 'Brunosbox',
                'Package-Version': '1.0',
                'Package-Vendor' : '',
                'Specification-Title' : ''
    }
}

// construir con: gradle fatJar
// java -jar build/libs/brunosbox-1.0-SNAPSHOT.jar
task fatJar(type: Jar) {
    manifest {
        attributes 'Main-Class' : 'edu.teamrocket.brunosbox.BrunosBox',
                'Package-Title' : 'Brunosbox',
                'Package-Version': '1.0',
                'Package-Vendor' : '',
                'Specification-Title' : ''
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

group = 'edu.teamrocket'
version = '1.0-SNAPSHOT'
description = 'brunosbox'
java.sourceCompatibility = JavaVersion.VERSION_21


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}